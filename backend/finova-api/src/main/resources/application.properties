spring.application.name=finova-api
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/finova_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

ollama.api.url=http://localhost:11434/api/generate
ollama.api.model=qwen2.5:3b

gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent

logging.level.org.springframework.jdbc=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.finova=DEBUG


finova.jwt.secret=${FINOVA_JWT_SECRET}
finova.jwt.expiration=86400000

finova.comprobantes.ruta=uploads/comprobantes

